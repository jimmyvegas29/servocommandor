[GUI]
borderless=true
fullscreen=true
#touch-only on the lathe; set true to see a mouse pointer
cursor=false
no_reverse=false

#Portrait build: the 7" 800x480 panel is used sideways. rotate=90 turns
#the whole UI (and touch) 90 degrees so it fills the panel as 480x800.
#Use rotate=0 for a plain 480x800 window on a desktop.
#(An upside-down mount is handled by "Flip display" in Settings > Display.)
rotate=90

#The official 7" panel's pixels are about 8% wider than tall (155x86mm for
#800x480), so a drawn circle shows as an oval. Round icons are pre-squashed
#by this factor so they look round on the glass. 1.0 = square pixels.
pixel_aspect=0.923

#kv File Options (landscape builds only - the portrait branch uses portrait.kv)
#Servo - 800x480 no torque layout
#Servo_tq - 800x480 torque layout
#Servo_reterm 1280x720 no torque layout
#Servo_tq_reterm 1280x720 torque layout
kvfile=Servo_tq



[DRO]
#Glass-scale tap board (RP2350 on USB serial streaming raw counts).
#enabled=false leaves the axis cards at zero (datums still work).
enabled=true
port=/dev/ttyACM0
#counts per mm of each scale (Sino KA 1um scales = 1000)
counts_per_mm=1000
#flip an axis so it reads the same direction as the Sino console
x_invert=true
z_invert=true

[Hardware]
#Set to true if the lathe runs backwards vs the FWD/REV labels.
#Flips the sign of every speed command in one place (GUI and physical
#switch both) - fix it here, not in the drive parameters.
invert_direction=true

[Settings]
#dosnt do anything
general=true

#rpm or surface_speed. Mode for display and how the rpm on the servo is set 
mode=rpm

#rated rpm of servo motor
servo_max_rpm=3000

#ratio between motor pully and final drive pulley
ratio=1.65

#bandsaw wheel, part, or tool diameter, can be in inches or metric
diameter=350

#inch or metric. Define unit of measurement
unit=metric


#Modes for setting buttons speeds
#Custom Strings tied to custom values can be configured
#Example format for custom string/speed (string, value) e.g. (Stainless, 50)
#Replace value for each button you want to customize with custom format
#Single word on string
#Max 10 Charactors will be display the rest will be clipped
#inc_btn's are excluded from custom format

[rpm]
#Incremental speed increase buttons inc_btnn should be a negative number
inc_btnp=+50
inc_btnn=-50
#quick set buttons
sp_btn1=50
sp_btn2=100
sp_btn3=200
sp_btn4=400
sp_btn5=600
sp_btn6=800
sp_btn7=1000
sp_btn8=1250
sp_btn9=1500

[surface_speed]
#Incremental speed increase buttons inc_btnn should be a negative number
inc_btnp=+5
inc_btnn=-5
#quick set buttons
sp_btn1=25
sp_btn2=50
sp_btn3=75
sp_btn4=100
sp_btn5=150
sp_btn6=200
sp_btn7=400
sp_btn8=600
sp_btn9=700

